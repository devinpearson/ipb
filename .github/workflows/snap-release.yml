name: Build and Publish Snap

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snap-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle project
        run: npm run bundle

      - name: Build Linux binary for snap
        run: npx pkg dist-bundle/index.cjs --targets node24-linux-x64 --out-path dist --no-bytecode --public

      - name: Normalize binary name
        run: |
          if [ -f "dist/investec-ipb-linux-x64" ]; then
            mv dist/investec-ipb-linux-x64 dist/ipb-linux-x64
          elif [ -f "dist/index" ]; then
            mv dist/index dist/ipb-linux-x64
          fi
          chmod +x dist/ipb-linux-x64

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        run: ./scripts/create-snap.sh "${GITHUB_REF#refs/tags/v}"

      - name: Locate snap artifact
        id: snap_file
        run: |
          SNAP_FILE=$(ls -1t ./*.snap | head -n 1)
          if [ -z "$SNAP_FILE" ]; then
            echo "No snap artifact found"
            exit 1
          fi
          echo "file=$SNAP_FILE" >> "$GITHUB_OUTPUT"
          echo "Snap file: $SNAP_FILE"

      - name: Upload snap artifact to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.snap_file.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snap to Snap Store (optional)
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS not configured, skipping Snap Store upload."
            exit 0
          fi

          # Snapcraft 7+ reads Ubuntu One credentials from SNAPCRAFT_STORE_CREDENTIALS
          # (output of `snapcraft export-login`). Do not write ~/.snapcraft/snapcraft.cfg.
          #
          # Support secrets stored either as raw export-login text or base64 of that text.
          CREDS="$SNAPCRAFT_STORE_CREDENTIALS"
          if [[ "$CREDS" != \{* ]]; then
            if DECODED=$(printf '%s' "$CREDS" | base64 -d 2>/dev/null) && [[ "$DECODED" == \{* ]]; then
              CREDS="$DECODED"
            fi
          fi
          export SNAPCRAFT_STORE_CREDENTIALS="$CREDS"

          snapcraft upload --release=stable "${{ steps.snap_file.outputs.file }}"
