# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main", "improvements"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run knip
      - run: npm test --if-present

  packaging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: "npm"
      - run: npm ci
      - run: npm run bundle
      - name: Smoke test bundle
        run: scripts/smoke-test.sh "node dist-bundle/index.cjs"
      - name: Build Linux standalone binary
        # --config package.json is what pulls templates/ and assets/ into the binary.
        run: npx pkg dist-bundle/index.cjs --config package.json --targets node24-linux-x64 --out-path dist --no-bytecode --public
      - name: Smoke test packaged binary
        run: |
          binary=$(ls dist/investec-ipb* dist/index 2>/dev/null | head -n 1)
          if [ -z "$binary" ]; then
            echo "Packaged binary not found"
            ls -la dist || true
            exit 1
          fi
          chmod +x "$binary"
          scripts/smoke-test.sh "$binary"
