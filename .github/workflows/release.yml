name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Signed build provenance for each binary (verify with `gh attestation verify`).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: x64
            target: node24-macos-x64
            binary-name: ipb-macos-x64
          - os: macos-latest
            platform: macos
            arch: arm64
            target: node24-macos-arm64
            binary-name: ipb-macos-arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: node24-linux-x64
            binary-name: ipb-linux-x64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            target: node24-linux-arm64
            binary-name: ipb-linux-arm64
          - os: windows-latest
            platform: win
            arch: x64
            target: node24-win-x64
            binary-name: ipb-win-x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Bundle with esbuild
        run: npm run bundle

      - name: Verify bundle output
        shell: bash
        run: |
          test -f dist-bundle/index.cjs || {
            echo "dist-bundle/index.cjs was not produced by npm run bundle"
            ls -la dist-bundle || true
            exit 1
          }

      - name: Smoke test bundle
        shell: bash
        run: scripts/smoke-test.sh "node dist-bundle/index.cjs"

      - name: Package binary
        # --config package.json is what pulls templates/ and assets/ into the binary.
        run: npx pkg dist-bundle/index.cjs --config package.json --targets ${{ matrix.target }} --out-path dist --no-bytecode --public

      - name: Rename binary (macOS/Linux)
        if: matrix.platform != 'win'
        run: |
          cd dist
          # pkg creates binaries with package name (investec-ipb-{platform}-{arch})
          # Rename to our desired format
          if [ -f "investec-ipb-${{ matrix.platform }}-${{ matrix.arch }}" ]; then
            mv investec-ipb-${{ matrix.platform }}-${{ matrix.arch }} ${{ matrix.binary-name }}
          elif [ -f "index" ]; then
            mv index ${{ matrix.binary-name }}
          fi
          chmod +x ${{ matrix.binary-name }}

      - name: Smoke test binary
        # Only run binaries built for the runner's own CPU.
        if: matrix.platform != 'win' && ((runner.arch == 'X64' && matrix.arch == 'x64') || (runner.arch == 'ARM64' && matrix.arch == 'arm64'))
        run: scripts/smoke-test.sh "dist/${{ matrix.binary-name }}"

      - name: Rename binary (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          cd dist
          # pkg creates binaries with package name
          if [ -f "investec-ipb-win-x64.exe" ]; then
            mv investec-ipb-win-x64.exe ${{ matrix.binary-name }}
          elif [ -f "index.exe" ]; then
            mv index.exe ${{ matrix.binary-name }}
          else
            echo "Expected Windows binary not found in dist/"
            ls -la
            exit 1
          fi

      - name: Calculate SHA256 checksum (macOS/Linux)
        if: matrix.platform != 'win'
        shell: bash
        run: |
          cd dist
          shasum -a 256 ${{ matrix.binary-name }} > ${{ matrix.binary-name }}.sha256

      - name: Calculate SHA256 checksum (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          cd dist
          sha256sum ${{ matrix.binary-name }} > ${{ matrix.binary-name }}.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.binary-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.binary-name }}
          path: |
            dist/${{ matrix.binary-name }}
            dist/${{ matrix.binary-name }}.sha256
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Extract version from tag
        id: tag_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "ipb-*" ! -name "*.sha256" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.sha256" -exec cp {} release-assets/ \;

      - name: Create checksums file
        run: |
          cd release-assets
          echo "# SHA256 Checksums" > checksums.txt
          echo "" >> checksums.txt
          for file in *.sha256; do
            if [ -f "$file" ]; then
              echo "## ${file%.sha256}" >> checksums.txt
              cat "$file" >> checksums.txt
              echo "" >> checksums.txt
            fi
          done

      - name: Generate Homebrew formula with release checksums
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');

          const version = process.env.VERSION;
          const checksums = new Map();
          const releaseAssetsDir = path.join(process.cwd(), 'release-assets');
          for (const file of fs.readdirSync(releaseAssetsDir)) {
            if (!file.endsWith('.sha256')) continue;
            const full = path.join(releaseAssetsDir, file);
            const content = fs.readFileSync(full, 'utf8').trim();
            const [sha, name] = content.split(/\s+/);
            if (sha && name) checksums.set(name, sha);
          }

          const required = [
            'ipb-macos-arm64',
            'ipb-macos-x64',
            'ipb-linux-arm64',
            'ipb-linux-x64',
          ];
          for (const artifact of required) {
            if (!checksums.has(artifact)) {
              throw new Error(`Missing checksum for ${artifact}`);
            }
          }

          const formula = [
            '# typed: false',
            '# frozen_string_literal: true',
            '',
            'class Ipb < Formula',
            '  desc "CLI application to manage programmable banking cards"',
            '  homepage "https://github.com/devinpearson/ipb"',
            `  version "${version}"`,
            '  license "MIT"',
            '',
            '  on_macos do',
            '    if Hardware::CPU.arm?',
            '      url "https://github.com/devinpearson/ipb/releases/download/v#{version}/ipb-macos-arm64"',
            `      sha256 "${checksums.get('ipb-macos-arm64')}"`,
            '',
            '      def install',
            '        bin.install "ipb-macos-arm64" => "ipb"',
            '      end',
            '    end',
            '    if Hardware::CPU.intel?',
            '      url "https://github.com/devinpearson/ipb/releases/download/v#{version}/ipb-macos-x64"',
            `      sha256 "${checksums.get('ipb-macos-x64')}"`,
            '',
            '      def install',
            '        bin.install "ipb-macos-x64" => "ipb"',
            '      end',
            '    end',
            '  end',
            '',
            '  on_linux do',
            '    if Hardware::CPU.arm?',
            '      url "https://github.com/devinpearson/ipb/releases/download/v#{version}/ipb-linux-arm64"',
            `      sha256 "${checksums.get('ipb-linux-arm64')}"`,
            '',
            '      def install',
            '        bin.install "ipb-linux-arm64" => "ipb"',
            '      end',
            '    end',
            '    if Hardware::CPU.intel?',
            '      url "https://github.com/devinpearson/ipb/releases/download/v#{version}/ipb-linux-x64"',
            `      sha256 "${checksums.get('ipb-linux-x64')}"`,
            '',
            '      def install',
            '        bin.install "ipb-linux-x64" => "ipb"',
            '      end',
            '    end',
            '  end',
            '',
            '  test do',
            '    system "#{bin}/ipb", "--version"',
            '  end',
            'end',
            '',
          ].join('\n');
          fs.writeFileSync(path.join(releaseAssetsDir, 'ipb.rb'), formula);
          EOF
        env:
          VERSION: ${{ steps.tag_version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          name: Release v${{ steps.tag_version.outputs.version }}
          body: |
            ## Release v${{ steps.tag_version.outputs.version }}

            ### Installation

            **Homebrew (macOS/Linux):**
            ```bash
            brew tap devinpearson/ipb
            brew install ipb
            ```

            **Direct Download:**
            - Download the appropriate binary for your platform
            - Make it executable: `chmod +x ipb-*`
            - Move to your PATH: `sudo mv ipb-* /usr/local/bin/ipb`

            **npm (requires Node.js):**
            ```bash
            npm install -g investec-ipb
            ```

            ### Verify your download
            See checksums.txt for SHA256 checksums of all binaries. Each binary also has a signed build attestation:
            ```bash
            gh attestation verify ipb-macos-arm64 --repo devinpearson/ipb
            ```
          # Lists merged pull requests below the body.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

