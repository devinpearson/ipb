name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish (e.g. v0.9.1). Leave empty to use the triggering ref.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow re-publishing a tag after trusted publishing is configured.
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - run: npm ci
      # Fails if any installed package's registry signature or provenance doesn't check out.
      - run: npm audit signatures
      - run: npm run build --if-present
      - run: npm run test:run
      - name: Smoke test the built CLI
        run: scripts/smoke-test.sh "node bin/index.js"
      - name: Verify package contents
        run: npm pack --dry-run

      # Auth via npm Trusted Publishing (OIDC). No long-lived NPM_TOKEN required.
      # Provenance is generated automatically for trusted publishes; --provenance is kept for clarity.
      - name: Publish to npm
        run: npm publish --access public --provenance
